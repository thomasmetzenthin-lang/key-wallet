<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>key-wallet Control Panel</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --accent: #38bdf8;
            --text: #f8fafc;
            --muted: #94a3b8;
            --success: #22c55e;
            --border: #334155;
        }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 2rem;
            display: flex;
            justify-content: center;
        }
        .container {
            max-width: 720px;
            width: 100%;
        }
        .header {
            border-bottom: 1px solid var(--border);
            padding-bottom: 1rem;
            margin-bottom: 2rem;
        }
        .header h1 {
            margin: 0;
            font-size: 1.75rem;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .header p {
            margin: 0.5rem 0 0 0;
            color: var(--muted);
            font-size: 0.95rem;
        }
        .card {
            background-color: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }
        .card h2 {
            margin-top: 0;
            font-size: 1.2rem;
            color: var(--text);
        }
        textarea {
            width: 100%;
            height: 120px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            padding: 0.75rem;
            font-family: monospace;
            box-sizing: border-box;
            resize: vertical;
        }
        textarea:focus {
            outline: 1px solid var(--accent);
        }
        button {
            background-color: var(--accent);
            color: #0f172a;
            font-weight: 600;
            border: none;
            padding: 0.6rem 1.25rem;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 0.75rem;
            transition: opacity 0.2s;
        }
        button:hover {
            opacity: 0.9;
        }
        .status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }
        .status-badge {
            background: var(--bg);
            border: 1px solid var(--border);
            padding: 0.75rem;
            border-radius: 6px;
            text-align: center;
        }
        .status-badge .name {
            font-size: 0.85rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .status-badge .state {
            font-weight: 600;
            margin-top: 0.25rem;
            font-size: 0.95rem;
        }
        .state.active { color: var(--success); }
        .state.inactive { color: var(--muted); }
        .endpoint-list {
            list-style: none;
            padding: 0;
            margin: 0;
            font-family: monospace;
            font-size: 0.9rem;
        }
        .endpoint-list li {
            padding: 0.5rem 0;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
        }
        .endpoint-list li:last-child { border-bottom: none; }
        .method { color: var(--accent); }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔐 key-wallet Dashboard</h1>
            <p>In-Memory Encrypted API Proxy Daemon</p>
        </div>

        <div class="card">
            <h2>Active Key Memory</h2>
            <div class="status-grid" id="status-grid">
                <div class="status-badge"><div class="name">OpenRouter</div><div class="state inactive" id="st-openrouter">Inactive</div></div>
                <div class="status-badge"><div class="name">Anthropic</div><div class="state inactive" id="st-anthropic">Inactive</div></div>
                <div class="status-badge"><div class="name">Gemini</div><div class="state inactive" id="st-gemini">Inactive</div></div>
                <div class="status-badge"><div class="name">OpenAI</div><div class="state inactive" id="st-openai">Inactive</div></div>
            </div>
        </div>

        <div class="card">
            <h2>Load Keys into RAM</h2>
            <textarea id="key-input" placeholder="Paste keys here (one per line)...&#10;sk-or-v1-...&#10;sk-ant-...&#10;AIzaSy..."></textarea>
            <button onclick="submitKeys()">Load Keys</button>
            <span id="msg" style="margin-left: 1rem; font-size: 0.9rem;"></span>
        </div>

        <div class="card">
            <h2>Local Proxy Endpoints</h2>
            <ul class="endpoint-list">
                <li><span><span class="method">POST</span> /v1/chat/completions</span> <span>127.0.0.1:9090</span></li>
                <li><span><span class="method">GET</span> /api/status</span> <span>127.0.0.1:9090</span></li>
            </ul>
        </div>
    </div>

    <script>
        async function fetchStatus() {
            try {
                const res = await fetch('/api/status');
                const data = await res.json();
                ['openrouter', 'anthropic', 'gemini', 'openai'].forEach(p => {
                    const el = document.getElementById('st-' + p);
                    if (data[p]) {
                        el.textContent = 'Active in RAM';
                        el.className = 'state active';
                    } else {
                        el.textContent = 'Inactive';
                        el.className = 'state inactive';
                    }
                });
            } catch (e) {
                console.error('Failed to fetch status:', e);
            }
        }

        async function submitKeys() {
            const keys = document.getElementById('key-input').value;
            const msg = document.getElementById('msg');
            msg.textContent = 'Loading...';
            try {
                const res = await fetch('/api/keys', {
                    method: 'POST',
                    headers: {'Content-Type': 'text/plain'},
                    body: keys
                });
                const text = await res.text();
                msg.textContent = text;
                document.getElementById('key-input').value = '';
                fetchStatus();
            } catch (e) {
                msg.textContent = 'Error loading keys';
            }
        }

        fetchStatus();
        setInterval(fetchStatus, 5000);
    </script>
</body>
</html>
